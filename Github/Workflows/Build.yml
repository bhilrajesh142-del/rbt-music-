name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: mkdir app && cp rbt_main.dart app/main.dart && cp rbt_pubspec.yaml app/pubspec.yaml
      - name: Create Android project
        working-directory: app
        run: flutter create . --org com.rbt --project-name rbt_music --platforms android
      - name: Use RBT MUSIC code
        working-directory: app
        run: |
          cp ../rbt_main.dart lib/main.dart
          cp ../rbt_pubspec.yaml pubspec.yaml
      - name: Permissions and app name
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="RBT MUSIC"#' $M
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: RBT-MUSIC-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
